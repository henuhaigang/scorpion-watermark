[package]
name = "scorpion-watermark"
version = "0.1.0"
edition = "2021"

[lib]
name = "scorpion_watermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
imageproc = "0.25"
ab_glyph = "0.2"
lopdf = "0.34"
blind_watermark = "0.1"
kamadak-exif = "0.6"
img-parts = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString"] }
core-foundation = "0.10"
core-graphics = "0.24"
